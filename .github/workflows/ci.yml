name: FraudLens CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  python-ml-and-features:
    name: ML Service & Shared Features Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r ml-service/requirements.txt
      - name: Run shared feature parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v shared/tests/
      - name: Run ml-service API contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ml-service:${{ github.workspace }}
        run: pytest -v ml-service/tests/

  frontend-build:
    name: Frontend Build (when package.json exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend if initialized
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run build
          else
            echo "frontend/package.json not merged yet; skipping build."
          fi

  docker-preflight:
    name: Docker Compose Pre-Flight Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env and validate compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend, ml-service, and streaming images
        run: |
          docker compose build ml-service backend streaming
