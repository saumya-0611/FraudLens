# FraudLens Docker Compose (CONTRACTS.md Section 1 & T0.3)
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# Jenkins Pre-flight / Offset Ports (BhashaFlow pattern):
#   FRONTEND_HOST_PORT=6173 BACKEND_HOST_PORT=6000 docker compose -p fraudlens_ci up --build -d

services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRAUDLENS_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudlens} -d ${POSTGRES_DB:-fraudlens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraudlens-net

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - fraudlens-net

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Creating FraudLens Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions-raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions-dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud-alerts --partitions 1 --replication-factor 1
        echo "Active topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - fraudlens-net

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRAUDLENS_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_store:/app/model_store
      - ./data-science/datasets:/app/data-science/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fraudlens-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRAUDLENS_ENV_FILE:-.env}
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fraudlens-net

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRAUDLENS_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/tmp/spark-checkpoints
    networks:
      - fraudlens-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRAUDLENS_ENV_FILE:-.env}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fraudlens-net

volumes:
  pgdata:
  model_store:
  spark_checkpoints:

networks:
  fraudlens-net:
    driver: bridge
