# FraudLens Single-VM Production Compose + Caddy HTTPS Edge
#
# Usage on a Linux VM (2-4 GB RAM, Docker Compose v2):
#   cp .env.prod.example .env.prod
#   # Edit .env.prod with strong unique secrets and your SITE_ADDRESS / PUBLIC_ORIGIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Architecture:
#   Internet :80/:443 -> Caddy (edge, 172.28.0.10)
#                          ├── /            -> compiled React SPA (/srv)
#                          ├── /api/*       -> backend:5000 (internal only)
#                          ├── /ws/alerts   -> backend:5000 (WSS upgrade, same origin)
#                          ├── /health, /ready -> backend:5000
#                          └── /api-docs*   -> backend:5000
#   Internal only (zero public ports): postgres, kafka, ml-service, streaming, backend

services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudlens} -d ${POSTGRES_DB:-fraudlens}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - fraudlens-prod

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512M -Xms256M}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - fraudlens-prod

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Ensuring FraudLens Kafka topics exist..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions-raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions-dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud-alerts --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - fraudlens-prod

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_store:/app/model_store
      - ./data-science/datasets:/app/data-science/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - fraudlens-prod

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      NODE_ENV: production
      PORT: "5000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_CIDRS: 172.28.0.10/32
      WS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required (e.g. https://fraudlens.example.com)}
      OAUTH_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fraudlens-prod

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      STREAM_ENGINE: ${STREAM_ENGINE:-spark}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/tmp/spark-checkpoints
    networks:
      - fraudlens-prod

  edge:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (e.g. 203.0.113.10.sslip.io or :80)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      fraudlens-prod:
        ipv4_address: 172.28.0.10

volumes:
  pgdata:
  model_store:
  spark_checkpoints:
  caddy_data:
  caddy_config:

networks:
  fraudlens-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
