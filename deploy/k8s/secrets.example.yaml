# Kubernetes Secret Template for FraudLens (T4.3 / C14)
# Copy to secrets.yaml locally (never commit real secrets) or create via:
#   kubectl create secret generic fraudlens-secrets --from-env-file=.env -n fraudlens
apiVersion: v1
kind: Namespace
metadata:
  name: fraudlens
---
apiVersion: v1
kind: Secret
metadata:
  name: fraudlens-secrets
  namespace: fraudlens
type: Opaque
stringData:
  POSTGRES_USER: "fraudlens"
  POSTGRES_PASSWORD: "change_me"
  POSTGRES_DB: "fraudlens"
  DATABASE_URL: "postgresql://fraudlens:change_me@postgres:5432/fraudlens"
  KAFKA_BROKERS: "kafka:9092"
  ML_SERVICE_URL: "http://ml-service:8000"
  JWT_SECRET: "change_me_long_random_at_least_32_characters"
  JWT_EXPIRES_IN: "2h"
  COOKIE_SECURE: "false"
  SERVICE_TOKEN: "change_me_service_token"
  INTERNAL_ML_TOKEN: "change_me_internal_token"
  SEED_ADMIN_PASSWORD: "change_me"
  SEED_ANALYST_PASSWORD: "change_me"
  SEED_VIEWER_PASSWORD: "change_me"
  VITE_PROXY_TARGET: "http://backend:5000"
