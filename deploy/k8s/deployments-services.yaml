# FraudLens Kubernetes Deployments & Services (T4.3 / C14)
# Only `frontend` (5173) and `backend` (5000) are exposed outside the cluster via NodePort.
# PostgreSQL, Kafka and ML use ClusterIP. Streaming has no listener.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fraudlens
  labels:
    fraudlens-phase: bootstrap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: fraudlens-postgres:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fraudlens
  labels:
    fraudlens-phase: bootstrap
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: fraudlens
  labels:
    fraudlens-phase: bootstrap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fraudlens
  labels:
    fraudlens-phase: bootstrap
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: fraudlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: fraudlens-ml-service:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: DATABASE_URL
            - name: INTERNAL_ML_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: INTERNAL_ML_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: fraudlens
spec:
  type: ClusterIP
  selector:
    app: ml-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
  namespace: fraudlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
        - name: streaming
          image: fraudlens-streaming:phase2
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: DATABASE_URL
            - name: INTERNAL_ML_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: INTERNAL_ML_TOKEN
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fraudlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fraudlens-backend:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: JWT_SECRET
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: SERVICE_TOKEN
            - name: INTERNAL_ML_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraudlens-secrets
                  key: INTERNAL_ML_TOKEN
            - name: JWT_EXPIRES_IN
              value: "2h"
            - name: COOKIE_SECURE
              value: "false"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fraudlens
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fraudlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fraudlens-frontend:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_PROXY_TARGET
              value: "http://backend:5000"
            - name: VITE_USE_MOCKS
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fraudlens
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
