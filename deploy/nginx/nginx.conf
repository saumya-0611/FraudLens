# FraudLens Production Nginx Reverse Proxy with HTTPS (TLS 1.2/1.3) & WebSocket Upgrade
# - HTTP port 80 -> 301 Permanent Redirect to HTTPS port 443
# - HTTPS port 443:
#     /          -> Frontend SPA (http://frontend:5173)
#     /api/      -> Backend REST API (http://backend:5000/api/)
#     /health, /ready -> Backend liveness and readiness
#     /ws/alerts -> Backend WebSocket Server (Upgrade: websocket)
#     /swagger/  -> Static OpenAPI 3.0 Swagger UI

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fraudlens_frontend {
        server frontend:5173;
    }

    upstream fraudlens_backend {
        server backend:5000;
    }

    # Redirect all plain HTTP requests to HTTPS
    server {
        listen 80;
        server_name localhost fraudlens.local;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block (TLS 1.2 / TLS 1.3)
    server {
        listen 443 ssl;
        server_name localhost fraudlens.local;

        ssl_certificate     /etc/nginx/certs/fraudlens.crt;
        ssl_certificate_key /etc/nginx/certs/fraudlens.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Hardened HTTP Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 100k;

        # Backend REST API
        location /api/ {
            proxy_pass         http://fraudlens_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # Public backend liveness and readiness checks
        location ~ ^/(health|ready)$ {
            proxy_pass         http://fraudlens_backend;
            proxy_set_header   Host $host;
        }

        # Real-Time Fraud Alerts WebSocket (/ws/alerts)
        location /ws/ {
            proxy_pass         http://fraudlens_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Swagger / OpenAPI Documentation UI
        location /swagger/ {
            alias /usr/share/nginx/html/swagger/;
            index index.html;
        }

        # React Frontend SPA
        location / {
            proxy_pass         http://fraudlens_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
        }
    }
}
